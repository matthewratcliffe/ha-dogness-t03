name: Dogness Treater (T03)
version: "1.2.4"
slug: dogness_t03
description: Live camera feed + treat dispensing for Dogness TUTK cameras (Smart Cam Treater T03 / T1020). Pure Go, LAN-direct, no cloud streaming.
url: "https://github.com/matthewratcliffe/ha-dogness-t03"
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
host_network: true
# Lets the add-on auto-register the bundled Lovelace card as a frontend
# resource via HA's WebSocket API (so users don't add a resource by hand).
homeassistant_api: true
services:
  - mqtt:want
# Needed only to install the bundled Lovelace card (dogness-card.js) into
# <config>/www so HA serves it at /local/dogness-card.js. The add-on writes
# just that one file.
map:
  - homeassistant_config:rw
ports:
  "1984/tcp": 1984
  "8554/tcp": 8554
  "8555/tcp": 8555
  "8555/udp": 8555
ports_description:
  "1984/tcp": "go2rtc web UI / API / treat endpoint"
  "8554/tcp": "RTSP"
  "8555/tcp": "WebRTC (TCP)"
  "8555/udp": "WebRTC (UDP)"
options:
  username: ""
  password: ""
  timezone: 0
  stream: "treater"
  mqtt_camera: true
  log_level: "info"
schema:
  username: "str"
  password: "password"
  timezone: "int(-12,14)"
  stream: "str?"
  mqtt_camera: "bool?"
  log_level: "list(trace|debug|info|warn|error)?"
